<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 2.5em; }

        .main-layout {
            display: grid;
            grid-template-columns: 220px 1fr 220px;
            gap: 20px;
            min-height: 600px;
        }

        .section-title {
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .initial-section .section-title { background: #888; }
        .tier-section .section-title { background: #667eea; }
        .unwatched-section .section-title { background: #e57373; }

        /* 왼쪽 초기 영화 */
        .initial-section { display: flex; flex-direction: column; }
        .initial-movies {
            flex: 1;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            min-height: 500px;
        }
        .initial-movies.drag-over { background: #e8f5e9; border-color: #4caf50; }

        /* 중앙 티어 */
        .tier-section { display: flex; flex-direction: column; }
        .tier-rows { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .tier-row { display: flex; gap: 0; border-radius: 10px; overflow: hidden; min-height: 110px; }
        .tier-label {
            width: 60px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5em;
            color: white;
            flex-shrink: 0;
        }
        .tier-s-label { background: #ff6b6b; }
        .tier-a-label { background: #ffa94d; }
        .tier-b-label { background: #ffd93d; color: #555; }
        .tier-c-label { background: #6bcf7f; }

        .tier-zone {
            flex: 1;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-left: none;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            min-height: 110px;
        }
        .tier-zone.drag-over { background: #e8f5e9; border-color: #4caf50; }

        /* 오른쪽 본 적 없음 */
        .unwatched-section { display: flex; flex-direction: column; }
        .unwatched-movies {
            flex: 1;
            background: #fff5f5;
            border: 2px dashed #e57373;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            min-height: 500px;
        }
        .unwatched-movies.drag-over { background: #fce4ec; border-color: #e91e63; }

        /* 영화 카드 */
        .movie-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.88em;
            font-weight: 500;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: transform 0.15s, box-shadow 0.15s;
            width: 100%;
        }
        .movie-card:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.3); }
        .movie-card.dragging { opacity: 0.4; }
        .movie-name { flex: 1; word-break: break-word; }
        .delete-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .delete-btn:hover { background: rgba(255,255,255,0.5); }

        /* 티어 안 카드는 너비 자동 */
        .tier-zone .movie-card { width: auto; min-width: 100px; }

        /* 입력 영역 */
        .input-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            display: flex;
            gap: 10px;
        }
        .input-section input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }
        .input-section input:focus { outline: none; border-color: #667eea; }
        .input-section button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.15s;
        }
        .input-section button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="container">
    <h1>🎬 영화 티어리스트</h1>

    <div class="main-layout">

        <!-- 왼쪽: 초기 영화 -->
        <div class="initial-section">
            <div class="section-title">📽️ 영화 목록</div>
            <div class="initial-movies" id="initialMovies"></div>
        </div>

        <!-- 중앙: 티어 -->
        <div class="tier-section">
            <div class="section-title">⭐ 티어 랭킹</div>
            <div class="tier-rows">
                <div class="tier-row">
                    <div class="tier-label tier-s-label">S</div>
                    <div class="tier-zone" id="tierS" data-key="S"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-label tier-a-label">A</div>
                    <div class="tier-zone" id="tierA" data-key="A"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-label tier-b-label">B</div>
                    <div class="tier-zone" id="tierB" data-key="B"></div>
                </div>
                <div class="tier-row">
                    <div class="tier-label tier-c-label">C</div>
                    <div class="tier-zone" id="tierC" data-key="C"></div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 본 적 없음 -->
        <div class="unwatched-section">
            <div class="section-title">❌ 본 적 없음</div>
            <div class="unwatched-movies" id="unwatchedMovies"></div>
        </div>

    </div>

    <div class="input-section">
        <input type="text" id="movieInput" placeholder="새 영화 제목 입력...">
        <button onclick="addMovie()">추가</button>
    </div>
</div>

<script>
    const DEFAULT_MOVIES = [
        '헤어질결심','인터스텔라','문라이트','화양연화','기생충',
        '호프','흐르는 여정','맨홀','오아시스'
    ];

    let data = { initial: [], S: [], A: [], B: [], C: [], unwatched: [] };
    let draggedMovie = null;
    let draggedFromKey = null;

    // ── 저장 / 불러오기 ──
    function saveData() {
        localStorage.setItem('tierlistData', JSON.stringify(data));
    }
    function loadData() {
        const saved = localStorage.getItem('tierlistData');
        if (saved) {
            data = JSON.parse(saved);
        } else {
            data.initial = [...DEFAULT_MOVIES];
            saveData();
        }
    }

    // ── 렌더링 ──
    function render() {
        renderZone('initialMovies', 'initial');
        renderZone('tierS', 'S');
        renderZone('tierA', 'A');
        renderZone('tierB', 'B');
        renderZone('tierC', 'C');
        renderZone('unwatchedMovies', 'unwatched');
    }

    function renderZone(elementId, dataKey) {
        const el = document.getElementById(elementId);
        el.innerHTML = '';
        data[dataKey].forEach((movie, idx) => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.draggable = true;
            card.dataset.movie = movie;
            card.dataset.from = dataKey;
            card.innerHTML = `
                <span class="movie-name">${movie}</span>
                <button class="delete-btn" title="삭제">✕</button>
            `;
            card.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteMovie(dataKey, idx);
            });
            card.addEventListener('dragstart', onDragStart);
            card.addEventListener('dragend', onDragEnd);
            el.appendChild(card);
        });
    }

    // ── 드래그 ──
    function onDragStart(e) {
        const card = e.currentTarget;
        draggedMovie = card.dataset.movie;
        draggedFromKey = card.dataset.from;
        setTimeout(() => card.classList.add('dragging'), 0);
        e.dataTransfer.effectAllowed = 'move';
    }
    function onDragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    }

    // ── 드롭존 설정 ──
    function setupDropZones() {
        const zones = [
            { id: 'initialMovies', key: 'initial' },
            { id: 'tierS',         key: 'S' },
            { id: 'tierA',         key: 'A' },
            { id: 'tierB',         key: 'B' },
            { id: 'tierC',         key: 'C' },
            { id: 'unwatchedMovies', key: 'unwatched' },
        ];
        zones.forEach(({ id, key }) => {
            const el = document.getElementById(id);
            el.dataset.key = key;
            el.addEventListener('dragover', onDragOver);
            el.addEventListener('dragleave', onDragLeave);
            el.addEventListener('drop', onDrop);
        });
    }

    function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-over');
    }
    function onDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }
    function onDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const targetKey = e.currentTarget.dataset.key;
        if (!draggedMovie || targetKey === draggedFromKey) return;

        // 출발지에서 제거
        data[draggedFromKey] = data[draggedFromKey].filter(m => m !== draggedMovie);
        // 목적지에 추가
        data[targetKey].push(draggedMovie);

        saveData();
        render();
        setupDropZones();
    }

    // ── 삭제 ──
    function deleteMovie(dataKey, idx) {
        data[dataKey].splice(idx, 1);
        saveData();
        render();
        setupDropZones();
    }

    // ── 영화 추가 ──
    function addMovie() {
        const input = document.getElementById('movieInput');
        const title = input.value.trim();
        if (!title) return;
        data.initial.push(title);
        input.value = '';
        saveData();
        render();
        setupDropZones();
    }

    document.getElementById('movieInput').addEventListener('keydown', (e) => {
         if (e.key === 'Enter' && !e.isComposing) {
        addMovie();
    }
});
    // ── 시작 ──
    loadData();
    render();
    setupDropZones();
</script>
</body>
</html>
